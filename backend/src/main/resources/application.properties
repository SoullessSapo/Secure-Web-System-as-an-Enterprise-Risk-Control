spring.application.name=enterprise-risk-api

# Auth0 resource-server settings. Override with environment variables per environment:
#   AUTH0_ISSUER_URI  e.g. https://YOUR_TENANT.us.auth0.com/  (https:// and the trailing slash are required)
#   AUTH0_AUDIENCE    must exactly equal the Auth0 API identifier
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTH0_ISSUER_URI:https://YOUR_TENANT.us.auth0.com/}
spring.security.oauth2.resourceserver.jwt.audiences=${AUTH0_AUDIENCE:https://enterprise-risk-api}

# Exact browser origins allowed to call the API (comma-separated, no wildcards).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://YOUR-SUBDOMAIN.duckdns.org}

# In production SERVER_ADDRESS=127.0.0.1 so only Apache on the same host can reach the app.
server.address=${SERVER_ADDRESS:0.0.0.0}
server.port=8080
server.forward-headers-strategy=native
server.error.include-message=never
server.error.include-stacktrace=never

# Expose only the health endpoint, without component details.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
