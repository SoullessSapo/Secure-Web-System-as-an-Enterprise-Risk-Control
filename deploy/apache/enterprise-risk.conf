# /etc/apache2/sites-available/enterprise-risk.conf
# Certbot (`certbot --apache -d YOUR-SUBDOMAIN.duckdns.org`) copies this vhost into
# enterprise-risk-le-ssl.conf for port 443 and adds an HTTP -> HTTPS redirect here.
<VirtualHost *:80>
    ServerName YOUR-SUBDOMAIN.duckdns.org
    DocumentRoot /var/www/enterprise-risk-frontend

    <Directory /var/www/enterprise-risk-frontend>
        Options -Indexes
        AllowOverride None
        Require all granted
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ /index.html [L]
    </Directory>

    # Only /api/ is forwarded to Spring Boot; /actuator and port 8080 stay private.
    ProxyPreserveHost On
    ProxyPass /api/ http://127.0.0.1:8080/api/
    ProxyPassReverse /api/ http://127.0.0.1:8080/api/
    # Reports http or https correctly in both this vhost and the certbot-generated SSL copy.
    RequestHeader set X-Forwarded-Proto expr=%{REQUEST_SCHEME}

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Strict-Transport-Security "max-age=31536000" "expr=%{HTTPS} == 'on'"

    ErrorLog ${APACHE_LOG_DIR}/enterprise-risk-error.log
    CustomLog ${APACHE_LOG_DIR}/enterprise-risk-access.log combined
</VirtualHost>
